<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bảng xếp hạng thành viên và ban tổ chức - Ý Niệm Điện Ảnh. Xem ai đang dẫn đầu về điểm đóng góp.">
    <title>Bảng Xếp Hạng — Ý Niệm Điện Ảnh</title>
    <link rel="icon" type="image/png" href="/Logo/avtar.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#07111d; --card:#10263b; --gold:#e4b866; --gold-light:#f3dba3; --text:#f8fafc; --muted:#aab6c5; --line:rgba(228,184,102,.25); }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:'Be Vietnam Pro',sans-serif; color:var(--text); background:radial-gradient(circle at 82% 0%,rgba(84,132,170,.18),transparent 22rem),linear-gradient(135deg,#07111d 0%,#102b44 52%,#06101b 100%); }
        nav { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 6%; border-bottom:1px solid var(--line); background:rgba(5,12,20,.9); }
        .brand { display:flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-family:'Playfair Display',serif; font-weight:700; }
        .brand img { width:44px; height:44px; border-radius:8px; object-fit:cover; }
        nav a:not(.brand) { color:var(--gold-light); font-weight:600; text-decoration:none; }
        main { max-width:1120px; margin:0 auto; padding:56px 24px 80px; }
        .eyebrow { color:var(--gold); font-size:.76rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
        h1,h2,h3 { font-family:'Playfair Display',serif; }
        h1 { margin:10px 0 12px; color:var(--gold-light); font-size:clamp(2.2rem,5vw,3.6rem); line-height:1.1; }
        .lead { max-width:680px; margin:0 0 30px; color:var(--muted); line-height:1.7; }
        .tabs { display:flex; gap:10px; margin:0 0 26px; flex-wrap:wrap; }
        .tab { flex:1; min-width:200px; padding:14px 18px; border:1px solid rgba(228,184,102,.28); border-radius:14px; background:rgba(5,12,20,.5); color:var(--muted); font-weight:700; font-size:.95rem; cursor:pointer; transition:all .2s; text-align:center; }
        .tab:hover { border-color:var(--gold); color:var(--gold-light); }
        .tab.active { background:linear-gradient(135deg,rgba(228,184,102,.2),rgba(228,184,102,.05)); border-color:var(--gold); color:var(--gold-light); box-shadow:0 0 24px rgba(228,184,102,.12); }
        .tab .count { opacity:.75; font-weight:500; font-size:.8rem; }
        .podium { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px; }
        .pod-card { border:1px solid var(--line); border-radius:18px; padding:22px 16px; text-align:center; background:rgba(5,12,20,.55); }
        .pod-card.p1 { border-color:rgba(228,184,102,.7); box-shadow:0 0 30px rgba(228,184,102,.18); order:2; }
        .pod-card.p2 { order:1; }
        .pod-card.p3 { order:3; }
        .medal { font-size:2rem; line-height:1; }
        .pod-name { margin-top:10px; font-weight:700; color:var(--text); font-size:1rem; }
        .pod-dept { color:var(--muted); font-size:.78rem; margin-top:4px; }
        .pod-points { margin-top:10px; display:inline-block; padding:4px 14px; border-radius:999px; background:rgba(228,184,102,.15); color:var(--gold-light); font-weight:800; font-size:1.05rem; }
        .board { border:1px solid var(--line); border-radius:18px; overflow:hidden; background:rgba(5,12,20,.45); }
        .row { display:grid; grid-template-columns:64px 1fr 1fr 120px; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid rgba(228,184,102,.1); }
        .row:last-child { border-bottom:0; }
        .row.head { background:rgba(228,184,102,.08); color:var(--muted); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; }
        .rank-no { text-align:center; font-weight:800; color:var(--gold); font-size:1.1rem; }
        .member-info .name { font-weight:700; color:var(--text); }
        .member-info .meta { color:var(--muted); font-size:.78rem; margin-top:3px; }
        .dept-cell { color:var(--muted); font-size:.85rem; }
        .points-cell { text-align:right; font-weight:800; color:var(--gold-light); }
        .empty { text-align:center; padding:60px 20px; color:var(--muted); }
        .empty .icon { font-size:3rem; margin-bottom:12px; }
        footer { padding:28px; border-top:1px solid var(--line); color:var(--muted); font-size:.86rem; text-align:center; }
        .loading { text-align:center; padding:60px 20px; color:var(--muted); }
        .refresh { margin-top:22px; text-align:right; }
        .refresh button { padding:8px 18px; border-radius:10px; border:1px solid rgba(228,184,102,.3); background:transparent; color:var(--gold-light); cursor:pointer; font-size:.8rem; font-weight:600; }
        .refresh button:hover { background:rgba(228,184,102,.12); }
        .error { text-align:center; padding:40px 20px; color:var(--danger,#ff7f7f); }
        @media (max-width:720px) {
            nav { padding:12px 20px; }
            main { padding:38px 16px 60px; }
            .podium { grid-template-columns:1fr; }
            .pod-card.p1 { order:1; } .pod-card.p2 { order:2; } .pod-card.p3 { order:3; }
            .row { grid-template-columns:44px 1fr 90px; }
            .dept-cell { display:none; }
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="/"><img src="/Logo/avtar.png" alt="Logo Ý Niệm Điện Ảnh">Ý Niệm Điện Ảnh</a>
        <a href="/">← Trang chủ</a>
    </nav>
    <main>
        <p class="eyebrow">Cộng đồng · Bảng xếp hạng</p>
        <h1>Bảng Xếp Hạng</h1>
        <p class="lead">Xếp hạng theo tổng điểm đóng góp của các thành viên và Ban Tổ Chức. Điểm được cập nhật mỗi khi cộng điểm vào Google Sheet.</p>

        <div class="tabs">
            <button class="tab active" data-group="mem" onclick="switchGroup('mem')">👥 Thành viên <span class="count" id="countMem"></span></button>
            <button class="tab" data-group="core" onclick="switchGroup('core')">⭐ Ban Tổ Chức <span class="count" id="countCore"></span></button>
        </div>

        <div id="rankContent">
            <div class="loading">Đang tải bảng xếp hạng…</div>
        </div>

        <div class="refresh">
            <button onclick="loadRanking(true)">🔄 Làm mới</button>
        </div>
    </main>
    <footer>Ý Niệm Điện Ảnh · “Ghi lại những khoảnh khắc trước khi chúng trở thành ký ức.”</footer>

    <script>
        let currentGroup = 'mem';
        let cached = null;

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }

        async function loadRanking(force) {
            const el = document.getElementById('rankContent');
            if (!force && cached) { render(cached); return; }
            el.innerHTML = '<div class="loading">Đang tải bảng xếp hạng…</div>';
            try {
                const res = await fetch('/api/ranking');
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Lỗi không xác định');
                cached = data;
                render(data);
            } catch (err) {
                el.innerHTML = '<div class="error">Không thể tải bảng xếp hạng: ' + esc(err.message) + '</div>';
            }
        }

        function medalFor(rank) {
            return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
        }

        function renderPodium(list) {
            const top = list.slice(0, 3);
            if (!top.length) return '';
            return '<div class="podium">' + top.map(function(item) {
                const cls = item.rank === 1 ? 'p1' : item.rank === 2 ? 'p2' : 'p3';
                return '<div class="pod-card ' + cls + '">' +
                    '<div class="medal">' + medalFor(item.rank) + '</div>' +
                    '<div class="pod-name">' + esc(item.name) + '</div>' +
                    '<div class="pod-dept">' + esc(item.dept || '—') + (item.role ? ' · ' + esc(item.role) : '') + '</div>' +
                    '<div class="pod-points">' + item.totalPoints + ' điểm</div>' +
                    '</div>';
            }).join('') + '</div>';
        }

        function renderList(list) {
            if (!list.length) {
                return '<div class="empty"><div class="icon">📭</div><div>Chưa có dữ liệu. Hãy thêm thành viên và cộng điểm vào Google Sheet để cập nhật bảng xếp hạng.</div></div>';
            }
            return '<div class="board">' +
                '<div class="row head"><div>Hạng</div><div>Thành viên</div><div>Ban</div><div>Điểm</div></div>' +
                list.map(function(item) {
                    const metaParts = [];
                    if (item.role) metaParts.push(item.role);
                    if (item.pointEntries) metaParts.push(item.pointEntries + ' lần cộng điểm');
                    if (item.reasons && item.reasons.length) metaParts.push(item.reasons.join(', '));
                    return '<div class="row">' +
                        '<div class="rank-no">' + medalFor(item.rank) + ' ' + item.rank + '</div>' +
                        '<div class="member-info"><div class="name">' + esc(item.name) + '</div><div class="meta">' + esc(metaParts.join(' · ')) + '</div></div>' +
                        '<div class="dept-cell">' + esc(item.dept || '—') + '</div>' +
                        '<div class="points-cell">' + item.totalPoints + '</div>' +
                        '</div>';
                }).join('') + '</div>';
        }

        function render(data) {
            const list = currentGroup === 'core' ? data.core : data.mem;
            document.getElementById('countMem').textContent = data.summary ? '(' + data.summary.mem + ')' : '';
            document.getElementById('countCore').textContent = data.summary ? '(' + data.summary.core + ')' : '';
            document.getElementById('rankContent').innerHTML =
                renderPodium(list) + renderList(list);
        }

        function switchGroup(g) {
            currentGroup = g;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.group === g);
            });
            if (cached) render(cached);
        }

        loadRanking(false);
        setInterval(function() { loadRanking(false); }, 120000);
    </script>
</body>
</html>
