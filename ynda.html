<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<meta name="description" content="YNDA Operations Management — hệ thống quản lý hoạt động nội bộ">
<title>YNDA Ops</title>
<link rel="manifest" href="/ynda-manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1226'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%237c6cff' font-family='sans-serif' font-weight='bold'>Y</text></svg>">
<style>
:root{--bg:#0f1226;--card:#171a33;--card2:#1d2142;--line:#2a2f55;--txt:#e8eaf6;--mut:#9aa0bd;--acc:#7c6cff;--ok:#3bd671;--warn:#ffb454;--err:#ff5c7a;--gold:#ffd166;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.5;min-height:100vh}
#app{max-width:1200px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:1.15rem;font-weight:800}
h2{font-size:1rem;font-weight:800;margin-bottom:10px}
.mut{color:var(--mut);font-size:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#062}
.btn.warn{background:var(--warn);color:#331}
.btn.danger{background:var(--err);color:#fff}
.btn.sm{padding:5px 10px;font-size:.75rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}
label{display:block;font-size:.72rem;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:7px 14px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--card)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.68rem;font-weight:800;color:#fff}
.pill.v{background:#5b6cff}.pill.g{background:var(--ok)}.pill.y{background:var(--warn);color:#331}.pill.r{background:var(--err)}.pill.m{background:var(--gold);color:#331}.pill.d{background:#3a3f66}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;font-size:.7rem;color:var(--mut);margin:2px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 20px;border-radius:12px;font-size:.85rem;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:50;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav-item{flex:1 0 64px;min-width:62px;padding:8px 0 10px;text-align:center;cursor:pointer;color:var(--mut);font-size:.6rem;font-weight:700;border:none;background:none}
.nav-item.nv{color:var(--acc)}
.nav-item svg{display:block;margin:0 auto 3px;width:20px;height:20px;fill:currentColor}
.loading{text-align:center;padding:40px;color:var(--mut)}
.empty{text-align:center;padding:26px;color:var(--mut);font-size:.85rem}
.badge{display:inline-flex;min-width:17px;height:17px;border-radius:9px;background:var(--err);color:#fff;font-size:.65rem;align-items:center;justify-content:center;padding:0 4px;margin-left:2px}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi .k{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k b{display:block;font-size:1.4rem}
.kpi .k span{font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem}
.modal-mask{position:fixed;inset:0;background:#0009;z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-mask.on{display:flex}
.modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px;border:1px solid var(--line)}
@media(min-width:700px){.modal-mask{align-items:center}.modal{border-radius:18px;padding:22px}}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.opt b{font-size:.85rem}.opt .mut{font-size:.72rem}
nav.sec{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
nav.sec button{background:none;border:none;color:var(--mut);padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer}
nav.sec button.on{background:var(--acc);color:#fff}
h3.s{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<div id="nav"><div id="navTabs"></div></div>

<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script>
'use strict';
if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  navigator.serviceWorker.register('/ynda-sw.js').catch(() => {});
}
// =============================================================================
// YNDA OPS — PWA SPA. Đọc trực tiếp REST API /api/ynda.
// Đăng nhập qua Firebase Auth; Firebase idToken lưu localStorage.
// Không nhúng logic XP nào ở client.
// =============================================================================
const BASE = '/api/ynda';
let S = { token: '', user: null, cfg: null, tab: 'me', tasks: [], board: [], missions: [], claims: [], assignments: [], submissions: [], reviews: [], ledger: [], users: [], seasons: [], production: [], templates: [], notifications: [], xp: null, leaderboard: null, audit: [], roleReviews: [] };
const N = name => document.querySelector(name);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function toast(msg, ms = 2200) { const t = N('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (fbAuth && fbAuth.currentUser) {
    try { S.token = await fbAuth.currentUser.getIdToken(); } catch (e) {}
  }
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  let res = await fetch(BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  // idToken hết hạn (1h) -> refresh rồi thử lại 1 lần
  if (res.status === 401 && fbAuth && fbAuth.currentUser) {
    try {
      S.token = await fbAuth.currentUser.getIdToken(true);
      headers['Authorization'] = 'Bearer ' + S.token;
      res = await fetch(BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    } catch (e) {}
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) {
    S.token = ''; localStorage.removeItem('ynda_t'); S.user = null; render();
    toast('Phiên hết hạn, đăng nhập lại');
  }
  if (!res.ok) throw new Error((data && (data.error || data.message)) || ('HTTP ' + res.status));
  return data;
}
const cap = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1).toLowerCase().replace(/_/g, ' ');
const fmtD = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const num = v => { const n = Number(v); return isNaN(n) ? '0' : String(n); };
const pillFor = st => {
  const map = { 'OPEN': 'g', 'DRAFT': 'd', 'SCHEDULED': 'y', 'ASSIGNED': 'v', 'COMPLETED': 'g', 'ARCHIVED': 'm', 'APPROVED': 'g', 'APPLIED': 'g', 'IN_PROGRESS': 'v', 'IN_REVIEW': 'y', 'NEEDS_REVISION': 'y', 'APPROVE': 'g', 'APPROVED': 'g', 'RETURN': 'y', 'REJECT': 'r', 'REJECTED': 'r', 'RELEASED': 'm', 'ACCEPTED': 'g', 'PENDING': 'y', 'CLAIMED': 'v', 'ACTIVE': 'g', 'EARLY': 'g', 'LATE': 'y' };
  const c = map[String(st).toUpperCase()] || 'd';
  return `<span class="pill ${c}">${esc(st)}</span>`;
};

const ICONS = {
  me: '<path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.7-8 6v2h16v-2c0-3.3-3.6-6-8-6z"/>',
  board: '<path d="M4 4h7v7H4zm9 0h7v16h-7zM4 13h7v7H4z"/>',
  tasks: '<path d="M5 3h14a1 1 0 011 1v16a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1zm2 4v2h10V7H7zm0 4v2h10v-2H7zm0 4v2h6v-2H7z"/>',
  xp: '<path d="M3 17l6-6 4 4 8-8-1.5-3H3v13z"/><path d="M3 21h18v-2H3z"/>',
  award: '<path d="M12 2l2.6 5.3 5.9.9-4.3 4.2 1 5.8L12 15.9 6.8 18.2l1-5.8L3.5 8.2l5.9-.9z"/>',
  users: '<path d="M16 11a4 4 0 100-8 4 4 0 000 8zm-8 1a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm8 2c-3.3 0-8 1.7-8 4v2h16v-2c0-2.3-4.7-4-8-4zm-8-1c-3.9 0-7 1.8-7 4v2h7.5c-.3-.6-.5-1.3-.5-2s.2-1.4.5-2H0z"/>',
  notif: '<path d="M12 2a7 7 0 00-7 7v4L3 17h18l-2-4v-4a7 7 0 00-7-7zm-2 16a2 2 0 004 0z"/>',
  audit: '<path d="M14 3H6v18h12V7l-4-4zm1 5h-3V5l3 3z"/>',
  mess: '<path d="M12 2a10 10 0 100 20l3.5-2A10 10 0 0012 2zm-2 5h4v2h-4zm0 3h6v2h-6zm0 3h6v2h-6z"/>'
};

function navDef() {
  const items = [
    ['me', 'Tôi'], ['board', 'Board'], ['tasks', 'Mission'], ['claims', 'Nhận'], ['reviews', 'Duyệt'], ['xp', 'XP'],
    ['award', 'BXH'], ['users', 'Thành viên'], ['bonus', 'Cộng tác'], ['review', 'Role'], ['season', 'Season'],
    ['prod', 'Sản xuất'], ['tpl', 'Template'], ['notif', 'Thông báo'], ['audit', 'Nhật ký'], ['mess', 'Messenger']
  ];
  const nav = document.createElement('nav');
  nav.className = 'nav-item';
  for (const [key, label] of items) {
    const b = el('button', 'nav-item' + (S.tab === key ? ' nv' : ''));
    b.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[key] || ICONS.me}</svg>${label}${key === 'reviews' && (S.submissions || []).some(s => s.REVIEW_STATUS === 'HUMAN_REVIEW') ? '<span class="badge">!</span>' : ''}`;
    b.onclick = () => { S.tab = key; render(); };
    nav.appendChild(b);
  }
  N('#navTabs').replaceChildren(nav);
}

async function loadBase() {
  try {
    const cfgRaw = await api('GET', '/config');
    S.cfg = cfgRaw && cfgRaw.config ? cfgRaw.config : cfgRaw;
    if (S.token && !S.user) S.user = (await api('GET', '/auth/me'))?.user || null;
  } catch (e) { /* 401 handled */ }
}

// ---------------------------------------------------------------- helpers per view
async function go(taskRef, action, body, okMsg) {
  try { const d = await api('POST', `/tasks/${taskRef}/${action}`, body || {}); toast(okMsg || cap(action) + ' OK'); await loadTabData(['tasks', 'claims', 'assignments', 'submissions']); render(); return d; }
  catch (e) { toast(e.message, 4000); }
}
async function loadTabData(keys) {
  const jobs = {
    tasks: () => api('GET', '/tasks').then(d => S.tasks = d.tasks || []),
    board: () => api('GET', '/board').then(d => S.board = d.board || d),
    missions: () => api('GET', '/missions').then(d => S.missions = d.missions || []),
    claims: () => api('GET', '/claims').then(d => S.claims = d.claims || []),
    assignments: () => api('GET', '/assignments').then(d => S.assignments = d.assignments || []),
    submissions: () => api('GET', '/submissions').then(d => S.submissions = d.submissions || []),
    reviews: () => api('GET', '/reviews/pending').then(d => S.reviews = d.reviews || []),
    ledger: () => api('GET', '/ledger').then(d => S.ledger = d.transactions || d.txns || []),
    users: () => api('GET', '/users').then(d => S.users = d.users || []),
    seasons: () => api('GET', '/seasons').then(d => S.seasons = d.seasons || []),
    production: () => api('GET', '/production').then(d => S.production = d.teams || []),
    templates: () => api('GET', '/templates').then(d => S.templates = d.templates || []),
    notifications: () => api('GET', '/notifications').then(d => S.notifications = d.notifications || []),
    xp: () => api('GET', '/xp').then(d => S.xp = d),
    leaderboard: () => api('GET', '/leaderboard').then(d => S.leaderboard = d),
    audit: () => api('GET', '/audit').then(d => S.audit = d.logs || []),
    roleReviews: () => api('GET', '/role-reviews').then(d => S.roleReviews = d.reviews || []),
    dashboard: () => api('GET', '/dashboard').then(d => S.dashboard = d),
  };
  await Promise.all((keys || Object.keys(jobs)).map(k => jobs[k]().catch(err => { if (!/401/.test(err.message)) console.warn(k, err.message); })));
}
const can = action => {
  const role = (S.user && S.user.ROLE) || '';
  if (action === 'view') return !!S.token;
  if (['createTask', 'approveTask', 'setDeadlines', 'extendDeadline', 'archive', 'assign', 'reviewProof', 'reviewMember', 'manage', 'audit', 'bonusCreate'].includes(action)) return ['FOUNDER', 'PRESIDENT', 'CO_FOUNDER', 'CORE_FOUNDER', 'CORE', 'VICE'].includes(role);
  if (action === 'claim' || action === 'submit' || action === 'respond') return !!S.token;
  return true;
};

// ---------------------------------------------------------------- views
const FIREBASE_CONFIG = { apiKey: "AIzaSyBCDm2B4jkFJ-B62aOpVar9uxXlVxT3QDQ", authDomain: "yniemdienanh-fb0b7.firebaseapp.com", projectId: "yniemdienanh-fb0b7", appId: "1:69246326577:web:50fb1d9cab97e7543fc210" };
let fbApp = null, fbAuth = null;
// Dùng DEFAULT app (giống index.html) để chia sẻ phiên đăng nhập cùng origin
function initFirebase() {
  if (fbAuth || typeof firebase === 'undefined') return;
  try {
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth(fbApp);
    fbAuth.onAuthStateChanged(u => {
      // u mới (login/logout/xuất hiện phiên) — xử lý tại resolveBoot
      if (_bootDone) onAuthUserChanged(u);
      else resolveBoot(u);
    });
  } catch (e) { console.warn('Firebase init fail', e.message); }
}

// Lấy idToken mới nhất (Firebase tự refresh khi hết hạn) — dùng cho mọi request
async function refreshToken() {
  if (!fbAuth || !fbAuth.currentUser) return '';
  try {
    const t = await fbAuth.currentUser.getIdToken();
    if (t) S.token = t;
    return t;
  } catch (e) { return ''; }
}

// Khi chưa có S.user nhưng Firebase còn phiên -> lấy idToken rồi xác lập trên API YNDA
let _restoring = null;
function restoreSession() {
  // Chỉ cho 1 lần restore song song — vài nguồn (boot sync, onAuthStateChanged,
  // onAuthUserChanged) có thể cùng gọi; nếu không chặn sẽ tạo trùng user.
  if (_restoring) return _restoring;
  _restoring = (async () => {
    if (!fbAuth || !fbAuth.currentUser) { showLogin(); return; }
    try {
      const idToken = await fbAuth.currentUser.getIdToken();
      const d = await api('POST', '/auth/login', { idToken });
      if (!d || !d.user) throw new Error('Không có dữ liệu user');
      S.token = idToken; S.user = d.user;
      await loadBase(); await loadTabData(); render();
    } catch (e) {
      // Login API thất bại -> luôn trả về màn đăng nhập (không bao giờ để màn trống)
      console.warn('session restore', e.message);
      showLogin(e.message && !/401/.test(e.message) ? e.message : undefined);
    } finally {
      _restoring = null;
    }
  })();
  return _restoring;
}

function viewAuth() {
  initFirebase();
  return `
  <div style="max-width:400px;margin:8vh auto;text-align:center">
    <h1 style="font-size:1.6rem">🎬 YNDA Ops</h1>
    <p class="mut" style="margin:6px 0 22px">Operations Management — dùng tài khoản YNDA của bạn</p>
    <div class="card" style="text-align:left">
      <button class="btn" style="width:100%;margin-bottom:10px" onclick="googleLogin()" id="btnGoogle">Tiếp tục với Google</button>
      <div class="mut" style="text-align:center;margin:6px 0">hoặc</div>
      <label>Email</label><input id="lgEmail" type="email" placeholder="thanhvien@ynda.vn">
      <label>Mật khẩu</label><input id="lgPass" type="password" placeholder="••••••••">
      <button class="btn" style="width:100%" onclick="doLogin()">Đăng nhập</button>
      <button class="btn ghost sm" style="width:100%;margin-top:10px" onclick="openRegister()">Đăng ký tài khoản mới</button>
    </div>
    <p class="mut" style="margin-top:14px">Chưa có tài khoản Firebase? Đăng ký bằng email trên web YNDA. Role (Core/Vice/Member) tự gán theo email trong database.</p>
  </div>`;
}
const BASE_TMPL_REG = '/register';

async function googleLogin() {
  initFirebase();
  if (!fbAuth) { toast('Firebase chưa sẵn sàng, thử lại'); return; }
  try {
    const prov = new firebase.auth.GoogleAuthProvider();
    const res = await fbAuth.signInWithPopup(prov);
    const idToken = await res.user.getIdToken();
    await finishLogin(idToken);
  } catch (e) { if (e.code !== 'auth/popup-closed-by-user') toast(e.message, 5000); }
}

async function doLogin() {
  initFirebase();
  if (!fbAuth) { toast('Firebase chưa sẵn sàng'); return; }
  const email = N('#lgEmail').value.trim(), password = N('#lgPass').value;
  if (!email || !password) { toast('Nhập email và mật khẩu'); return; }
  try {
    const cred = firebase.auth.EmailAuthProvider.credential(email, password);
    const res = await fbAuth.signInWithCredential(cred);
    const idToken = await res.user.getIdToken();
    await finishLogin(idToken);
  } catch (e) { toast(e.message, 5000); }
}

async function finishLogin(idToken) {
  S.token = idToken; localStorage.setItem('ynda_t', '1');
  const d = await api('POST', '/auth/login', { idToken });
  S.user = d.user;
  await loadBase(); await loadTabData(); render(); toast('Đã đăng nhập: ' + (d.user && d.user.NAME || ''));
}

function openRegister() { window.location = BASE_TMPL_REG; }

function viewMe() {
  const u = S.user || {};
  const d = S.dashboard || {};
  const mb = d.breakdown || {};
  const myTasks = d.myTasks || [];
  return `<div class="card">
    <div class="row" style="align-items:center">
      <div style="min-width:0"><h1>${esc(u.NAME || u.name || '')}</h1>
        <span class="pill ${u.ROLE === 'MEMBER' ? 'v' : 'g'}">${esc(u.ROLE || '')}</span>
        <span class="chip">${esc(u.DEPARTMENT || '')}</span><span class="chip">${esc(u.EMAIL || '')}</span></div>
      <button class="btn ghost sm" onclick="logout()">Đăng xuất</button>
    </div></div>
  <div class="kpi">
    <div class="k"><b id="kOverall">${num(mb.overall)}</b><span>Overall XP</span></div>
    <div class="k"><b id="kTask">${num(mb.taskXp || mb.task)}</b><span>Task</span></div>
    <div class="k"><b id="kBonus">${num(mb.bonusXp || mb.bonus)}</b><span>Bonus</span></div>
    <div class="k"><b id="kPenalty">${num(mb.penaltyXp || mb.penalty)}</b><span>Penalty</span></div>
  </div>
  ${u.ROLE !== 'MEMBER' ? `<div class="kpi">
    <div class="k"><b>${num(mb.rolePoint)}</b><span>Role Point (gốc)</span></div>
    <div class="k"><b>${num(mb.roleContribution)}</b><span>Role x60%</span></div>
  </div>` : ''}

function logout() { if (fbAuth) { try { fbAuth.signOut(); } catch (e) {} } S.token = ''; localStorage.removeItem('ynda_t'); S.user = null; render(); toast('Đã đăng xuất'); }

async function render() {
  navDef();
  const app = N('#app');
  if (!S.token) {
    initFirebase();
    // Nếu Firebase còn phiên (mới khôi phục bất đồng bộ) -> chờ restore
    if (fbAuth && fbAuth.currentUser) { await restoreSession(); return; }
    app.innerHTML = viewAuth();
    return;
  }
  await Promise.all([loadBase(), loadTabData()]);
  S.activeSeason = (S.seasons || []).find(s => s.STATUS === 'ACTIVE')?.SEASON_ID;
  const view = VIEWS[S.tab] || viewMe;
  app.innerHTML = view();
  if (S.tab === 'award') renderLeaderboard();
  if (S.tab === 'roleReview') renderRoleReviews();
  if (S._submitRef) { openSubmit(S._submitRef); S._submitRef = null; }
}
// Trạng thái boot: chờ Firebase khôi phục phiên (bất đồng bộ) rồi mới render
let _bootDone = false;
function resolveBoot(u) {
  if (_bootDone) { onAuthUserChanged(u); return; }
  _bootDone = true;
  if (u) {
    refreshToken().then(t => { if (t) restoreSession(); else showLogin(); });
  } else {
    showLogin();
  }
}

// Xử lý thay đổi phiên sau khi đã boot xong (login/logout)
function onAuthUserChanged(u) {
  if (u) {
    refreshToken().then(t => { if (t && !S.user) restoreSession(); });
  } else {
    S.token = ''; localStorage.removeItem('ynda_t'); S.user = null;
    showLogin();
  }
}

function showLogin(msg) {
  S.token = ''; localStorage.removeItem('ynda_t'); S.user = null;
  if (msg) { try { toast(msg, 5000); } catch (e) {} }
  navDef(); N('#app').innerHTML = viewAuth();
}

// S.token chỉ là cache phiên; nếu có user Firebase trước đó, boot qua Firebase
initFirebase();
if (fbAuth) {
  // Nếu Firebase đã khôi phục xong ngay (bộ nhớ local) — onAuthStateChanged cũng sẽ gọi
  const cur = fbAuth.currentUser;
  if (cur) { refreshToken().then(t => { if (t) restoreSession(); else showLogin(); }); }
  setTimeout(() => { if (!S.user && !_bootDone) { _bootDone = true; showLogin(); } }, 4000);
} else {
  showLogin();
}
</script>
